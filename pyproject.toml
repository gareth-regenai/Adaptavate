[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008 flags Depends() in argument defaults. That is the documented, correct
# FastAPI idiom for dependency injection; working around it would make the code
# worse to satisfy a linter.
"app/main.py" = ["B008"]
# The workbook generators are deliberately terse table-building scripts. Packed
# assignments read better there than one statement per line.
"tools/make_test_model.py" = ["E702"]
"tools/make_messy_workbook.py" = ["E702"]
"tools/explain_trace.py" = ["E702"]
